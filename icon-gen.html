<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Life OS — Icon Generator</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;display:flex;gap:20px;padding:30px;align-items:flex-start}canvas{border-radius:12px}button{display:block;margin-top:8px;padding:8px 16px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}</style>
</head>
<body>
<div><canvas id="c192" width="192" height="192"></canvas><button onclick="dl('c192','icon-192.png')">Download icon-192.png</button></div>
<div><canvas id="c512" width="512" height="512"></canvas><button onclick="dl('c512','icon-512.png')">Download icon-512.png</button></div>
<script>
function draw(id) {
  const c = document.getElementById(id);
  const size = c.width;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, size, size);
  const m = size * 0.12, cs = size - m * 2;
  ctx.beginPath();
  ctx.arc(size/2, size/2, cs/2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(59,130,246,0.11)';
  ctx.fill();
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = size * 0.022;
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${size*0.28}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('LOS', size/2, size/2);
}
function dl(id, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}
draw('c192');
draw('c512');
</script>
</body>
</html>

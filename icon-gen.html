<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Life OS — Icon Generator</title>
<style>body{font-family:sans-serif;background:#111;color:#fff;display:flex;gap:20px;padding:30px;align-items:flex-start}canvas{border-radius:12px}button{display:block;margin-top:8px;padding:8px 16px;background:#f59e0b;color:#000;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}</style>
</head>
<body>
<div><canvas id="c192" width="192" height="192"></canvas><button onclick="dl('c192','icon-192.png')">Download icon-192.png</button></div>
<div><canvas id="c512" width="512" height="512"></canvas><button onclick="dl('c512','icon-512.png')">Download icon-512.png</button></div>
<script>
function draw(id) {
  const c = document.getElementById(id);
  const size = c.width;
  const ctx = c.getContext('2d');
  // Dark background
  ctx.fillStyle = '#0d0d0d';
  ctx.fillRect(0, 0, size, size);
  // Rounded rect clip for icon shape
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#0d0d0d';
  ctx.fill();
  // Amber glow circle
  const grd = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size*0.48);
  grd.addColorStop(0, 'rgba(245,158,11,0.18)');
  grd.addColorStop(1, 'rgba(245,158,11,0)');
  ctx.beginPath();
  ctx.arc(size/2, size/2, size*0.48, 0, Math.PI*2);
  ctx.fillStyle = grd;
  ctx.fill();
  // Lightning bolt path
  const s = size;
  ctx.save();
  ctx.beginPath();
  // Points scaled to canvas: bolt occupies ~40% width, 65% height, centered
  const bx = s * 0.5;  // center x
  const by = s * 0.5;  // center y
  const bw = s * 0.22; // half-width
  const bh = s * 0.34; // half-height
  // Bolt: top-right tip → mid-right notch → bottom-right tip → bottom-left → mid-left notch → top-left
  ctx.moveTo(bx + bw * 0.55, by - bh);        // top right
  ctx.lineTo(bx - bw * 0.08, by - bh * 0.05); // mid notch left (going down-left)
  ctx.lineTo(bx + bw * 0.38, by - bh * 0.05); // mid notch right
  ctx.lineTo(bx - bw * 0.55, by + bh);        // bottom left
  ctx.lineTo(bx + bw * 0.08, by + bh * 0.05); // mid notch right (going up-right)
  ctx.lineTo(bx - bw * 0.38, by + bh * 0.05); // mid notch left
  ctx.closePath();
  // Amber gradient fill
  const boltGrd = ctx.createLinearGradient(bx - bw, by - bh, bx + bw, by + bh);
  boltGrd.addColorStop(0, '#fde68a');
  boltGrd.addColorStop(0.5, '#f59e0b');
  boltGrd.addColorStop(1, '#d97706');
  ctx.fillStyle = boltGrd;
  ctx.shadowColor = '#f59e0b';
  ctx.shadowBlur = size * 0.06;
  ctx.fill();
  ctx.restore();
}
function dl(id, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}
draw('c192');
draw('c512');
</script>
</body>
</html>
